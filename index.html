*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--parchment);font-family:var(--font-body);overflow:hidden}

header{padding:12px 16px 10px;border-bottom:1px solid var(--ink-line);background:rgba(23,19,15,.98);z-index:8}

.sub{font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--parchment-dim);margin-top:4px;max-width:920px}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px}
.control{background:var(--ink-panel);border:1px solid var(--ink-line);color:var(--parchment);height:33px;border-radius:4px;padding:0 9px;font-size:12px}
#search{width:min(255px,44vw)} #search::placeholder{color:var(--parchment-dim)} select.control{cursor:pointer}
button.control{cursor:pointer;transition:.14s ease} button.control:hover{border-color:var(--gold);background:var(--ink-panel-2)}
.view-tabs{height:33px;display:flex;border:1px solid var(--ink-line);border-radius:4px;overflow:hidden;background:var(--ink-panel)}
.view-tab{border:0;border-right:1px solid var(--ink-line);background:transparent;color:var(--parchment-dim);padding:0 11px;cursor:pointer;font-size:11.5px}

#main{flex:1;min-height:0;display:flex;position:relative} #cy{flex:1;min-width:0;min-height:0}
#panel{width:0;overflow:hidden;flex:none;border-left:1px solid var(--ink-line);background:var(--ink-panel);transition:width .18s ease;position:relative;z-index:7}
#panel.open{width:350px} #panel-inner{width:350px;height:100%;overflow:auto;padding:22px 20px 34px}
#panel h2{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:22px;line-height:1.12;margin:0 38px 4px 0}

.field{margin-top:14px}.label{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--parchment-dim)}.value{font-size:13px;line-height:1.48;margin-top:3px}

#legend{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(33,27,21,.96);border:1px solid var(--ink-line);border-radius:5px;padding:11px 13px;font-size:11px;line-height:1.6;backdrop-filter:blur(4px);max-width:330px;box-shadow:0 8px 26px rgba(0,0,0,.22);display:none}

#stats{position:absolute;right:12px;bottom:12px;z-index:4;font-family:var(--font-mono);font-size:9.5px;color:var(--parchment-dim);background:rgba(23,19,15,.82);border:1px solid rgba(59,49,38,.6);padding:5px 7px;border-radius:3px;pointer-events:none}
#viewHint{position:absolute;left:12px;top:12px;z-index:4;font-family:var(--font-mono);font-size:9px;color:#8f826b;background:rgba(23,19,15,.73);padding:4px 6px;border-radius:3px;pointer-events:none}
@media(max-width:820px){header{padding:9px 9px 8px}.head-row{gap:7px}h1{font-size:20px}.sub{font-size:8.8px}.toolbar{gap:4px;margin-top:7px}.control{height:30px;font-size:10.5px;padding:0 7px}#search{width:100%;flex:1 1 100%}.view-tabs{height:30px}.view-tab{font-size:10px;padding:0 7px}#stats{display:none}#panel{position:absolute;right:0;top:0;bottom:0;box-shadow:-8px 0 24px rgba(0,0,0,.3)}#panel.open{width:min(90vw,350px)}#legend{left:8px;bottom:8px;max-width:88vw}}

  const faith=p.religionOrigin===p.religionCurrent?faithGlyph(p.religionCurrent):`${faithGlyph(p.religionOrigin)}→${faithGlyph(p.religionCurrent)}`;
  return `${p.flag} ${shortName(p.name)}\n${p.birthApprox?'≈ ':''}${p.birthYear} · ${faith}`;
}

// Separate family lanes make the genealogy easier to scan horizontally.
// Xhavella and Bilali intentionally have their own columns. Voskopoja is kept
// at the far right because its family relationships are comparatively independent.
// Ana Xhavella bridges Xhavella ↔ Ibrahimi; Fatimja bridges Ibrahimi ↔ Bilali.
const LANE_ORDER=['History','Komneni','Xhavella','Ibrahim','Bilali','BenishiBakri','Voskopoja'];
const LANE_LABEL={
  History:{sq:'Histori / paraardhës',it:'Storia / antenati',en:'History / ancestors'},
  Komneni:{sq:'Komnenët',it:'Komneni',en:'Komneni'},
  Xhavella:{sq:'Xhavellat',it:'Xhavella',en:'Xhavella'},
  Ibrahim:{sq:'Ibrahimi · fshati',it:'Ibrahim · villaggio',en:'Ibrahim · village'},
  Voskopoja:{sq:'Voskopoja · mjeshtrit',it:'Voscopoli · maestranze',en:'Voskopoja · builders'},
  BenishiBakri:{sq:'Benishi · Bakri',it:'Benishi · Bakri',en:'Benishi · Bakri'},
  Bilali:{sq:'Bilali',it:'Bilal',en:'Bilal'}
};
function laneFor(p){
  const f=p.family;
  if(p.role==='historical'||f.includes('historik')||f.includes('Stamboll · historik'))return'History';
  if(['Komneni','Sheba / Komneni','Mavromatis','Kretë','Komneni · Kretë','Komneni / Kurila'].includes(f))return'Komneni';
  if(f==='Xhavella'||p.id==='ana_xhavella')return'Xhavella';
  if(['Voskopoja','Kurila / Voskopoja','Mjeshtrit'].includes(f))return'Voskopoja';
  if(['Benishi','Bakri','Bakri / Benishi'].includes(f))return'BenishiBakri';
  if(['Bilali','Bilali / Ibrahimi'].includes(f))return'Bilali';
  return'Ibrahim';
}
function branchFor(p){
  if(p.role==='historical'||p.family.includes('historik')||p.family.includes('Stamboll · historik'))return'history';
  if(['Komneni','Sheba / Komneni','Mavromatis','Kretë','Komneni · Kretë','Komneni / Kurila'].includes(p.family))return'komneni';
  if(['Voskopoja','Kurila / Voskopoja','Mjeshtrit'].includes(p.family))return'vosk';
  if(['Benishi','Bakri','Bakri / Benishi'].includes(p.family))return'benishi';
  if(['Bilali','Bilali / Ibrahimi'].includes(p.family))return'bilali';
  if(['Tepelena','Mihali / Zoica'].includes(p.family))return'village';
  return'ibrahim';
}

const minYear=Math.min(...PEOPLE.map(p=>p.birthYear)), maxYear=Math.max(...PEOPLE.map(p=>p.birthYear));
const NODE_W=166,NODE_H=54,LANE_W=350,X0=220;
const familyPositions={}, timelinePositions={};
// In the family-tree view, couples that fall in the same 25-year band are deliberately
// placed side-by-side. This prevents a spouse line from cutting diagonally through unrelated
// people (for example Jorgo Mavromatisi / Sheba) and makes the view read like a genealogy.
function rowsForFamilyBand(arr){
  const byId=new Map(arr.map(p=>[p.id,p]));
  const unused=new Set(arr.map(p=>p.id));
  const rows=[];
  const pairRels=RELATIONS
    .filter(r=>(r.type==='spouse'||r.type==='partner')&&byId.has(r.source)&&byId.has(r.target))
    .slice().sort((a,b)=>{
      const aa=Math.min(byId.get(a.source).birthYear,byId.get(a.target).birthYear);
      const bb=Math.min(byId.get(b.source).birthYear,byId.get(b.target).birthYear);
      return aa-bb||a.source.localeCompare(b.source);
    });
  pairRels.forEach(r=>{
    if(!unused.has(r.source)||!unused.has(r.target))return;
    rows.push([byId.get(r.source),byId.get(r.target)]); // source left, target right
    unused.delete(r.source);unused.delete(r.target);
  });
  const singles=arr.filter(p=>unused.has(p.id)).sort((a,b)=>a.birthYear-b.birthYear||a.name.localeCompare(b.name));
  for(let i=0;i<singles.length;i+=2)rows.push(singles.slice(i,i+2));
  return rows;
}
function buildFamilyPositions(){
  const firstBand=Math.floor(minYear/25)*25, lastBand=Math.floor(maxYear/25)*25;
  const bands=[];for(let y=firstBand;y<=lastBand;y+=25)bands.push(y);
  const groups=new Map(), rowsByKey=new Map();
  PEOPLE.forEach(p=>{const band=Math.floor(p.birthYear/25)*25,key=`${laneFor(p)}|${band}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)});
  bands.forEach(b=>LANE_ORDER.forEach(l=>{const key=`${l}|${b}`;rowsByKey.set(key,rowsForFamilyBand(groups.get(key)||[]));}));
  let yCursor=130;
  const bandMeta={};
  bands.forEach(b=>{
    let maxRows=1;
    LANE_ORDER.forEach(l=>{maxRows=Math.max(maxRows,(rowsByKey.get(`${l}|${b}`)||[]).length);});
    const h=Math.max(145,maxRows*72+55);bandMeta[b]={top:yCursor,height:h,center:yCursor+h/2};yCursor+=h;
  });
  bands.forEach(b=>LANE_ORDER.forEach((lane,li)=>{
    const rows=rowsByKey.get(`${lane}|${b}`)||[];
    rows.forEach((row,rowIndex)=>row.forEach((person,col)=>{
      // A singleton is centered in its lane; a two-person row uses symmetric slots.
      const offset=row.length===1?0:(col?94:-94);
      const cx=X0+li*LANE_W+offset,cy=bandMeta[b].top+48+rowIndex*72;
      familyPositions[person.id]={x:cx,y:cy};
    }));
  }));

  // Bridge characters sit halfway between their birth-family and married-family lanes.
  if(familyPositions.ana_xhavella){
    const xXhavella=X0+LANE_ORDER.indexOf('Xhavella')*LANE_W;
    const xIbrahim=X0+LANE_ORDER.indexOf('Ibrahim')*LANE_W;
    familyPositions.ana_xhavella.x=(xXhavella+xIbrahim)/2;
  }
  if(familyPositions.fatimja){
    const xIbrahim=X0+LANE_ORDER.indexOf('Ibrahim')*LANE_W;
    const xBilali=X0+LANE_ORDER.indexOf('Bilali')*LANE_W;
    familyPositions.fatimja.x=(xIbrahim+xBilali)/2;
  }
  return {bands,bandMeta,totalHeight:yCursor+80};
}
const familyMeta=buildFamilyPositions();
function buildTimelinePositions(){
  const bucketUse={};
  PEOPLE.slice().sort((a,b)=>a.birthYear-b.birthYear).forEach(p=>{
    const lane=laneFor(p), bucket=Math.round(p.birthYear/8),key=`${lane}|${bucket}`,idx=bucketUse[key]||0;bucketUse[key]=idx+1;
    const x=X0+LANE_ORDER.indexOf(lane)*LANE_W+(idx%2?82:-82);
    const y=110+(p.birthYear-minYear)*7.4+Math.floor(idx/2)*58;
    timelinePositions[p.id]={x,y};
  });
  // Preserve the bridge positions in the timeline view as well.
  if(timelinePositions.ana_xhavella){
    const xXhavella=X0+LANE_ORDER.indexOf('Xhavella')*LANE_W;
    const xIbrahim=X0+LANE_ORDER.indexOf('Ibrahim')*LANE_W;
    timelinePositions.ana_xhavella.x=(xXhavella+xIbrahim)/2;
  }
  if(timelinePositions.fatimja){
    const xIbrahim=X0+LANE_ORDER.indexOf('Ibrahim')*LANE_W;
    const xBilali=X0+LANE_ORDER.indexOf('Bilali')*LANE_W;
    timelinePositions.fatimja.x=(xIbrahim+xBilali)/2;
  }
}
buildTimelinePositions();

// Immutable canonical coordinates for deterministic view switching.
// IMPORTANT: Cytoscape may mutate position objects supplied to graph elements/layouts,
// so the canonical snapshots must never be passed by reference.
function snapshotPositions(src){
  const out={};
  Object.entries(src).forEach(([id,pos])=>{out[id]=Object.freeze({x:Number(pos.x),y:Number(pos.y)});});
  return Object.freeze(out);
}
const FAMILY_PRESET=snapshotPositions(familyPositions);
const TIMELINE_PRESET=snapshotPositions(timelinePositions);

// Build union junctions: two parents share one short junction-to-child path instead of two long parallel parent edges.
const parentRels=RELATIONS.filter(r=>r.type==='parent');
const parentsByChild={};parentRels.forEach(r=>(parentsByChild[r.target]??=[]).push(r.source));
const unionMap=new Map(), unionForParentChild=new Map();
Object.entries(parentsByChild).forEach(([child,parents])=>{
  const uniq=[...new Set(parents)];if(uniq.length<2)return;
  const key=uniq.slice().sort().join('__');
  if(!unionMap.has(key)){
    const coupleRel=RELATIONS.find(r=>(r.type==='spouse'||r.type==='partner')&&uniq.includes(r.source)&&uniq.includes(r.target));
    unionMap.set(key,{id:`union_${unionMap.size}`,parents:uniq,children:[],coupleType:coupleRel?coupleRel.type:'coparent'});
  }
  unionMap.get(key).children.push(child);uniq.forEach(pid=>unionForParentChild.set(`${pid}|${child}`,key));
});
const unionPairKeys=new Set(unionMap.keys());

const elements=[];
PEOPLE.forEach(p=>elements.push({data:{...p,id:p.id,label:nodeLabel(p),originColor:faithColor(p.religionOrigin),currentColor:faithColor(p.religionCurrent)},position:{x:FAMILY_PRESET[p.id].x,y:FAMILY_PRESET[p.id].y},classes:`person role-${p.role}`}));
RELATIONS.forEach((r,i)=>elements.push({data:{id:`orig_${i}`,source:r.source,target:r.target,type:r.type,label:r.label||''},classes:`orig-edge rel-${r.type}`}));
unionMap.forEach((u,key)=>{
  elements.push({data:{id:u.id,unionKey:key},position:{x:0,y:0},classes:'union-node'});
  u.parents.forEach((pid,j)=>elements.push({data:{id:`arm_${u.id}_${j}`,source:pid,target:u.id,type:'family-arm',coupleType:u.coupleType},classes:`family-helper family-arm arm-${u.coupleType}`}));
  u.children.forEach((cid,j)=>elements.push({data:{id:`child_${u.id}_${j}`,source:u.id,target:cid,type:'family-child'},classes:'family-helper family-child'}));
});
parentRels.filter(r=>!unionForParentChild.has(`${r.source}|${r.target}`)).forEach((r,i)=>elements.push({data:{id:`single_${i}`,source:r.source,target:r.target,type:'single-parent'},classes:'family-helper single-parent'}));

// Decorations are graph elements, so they pan and zoom with the family tree.
const DECO_RIGHT=X0+(LANE_ORDER.length-1)*LANE_W+220;
LANE_ORDER.forEach((lane,i)=>elements.push({data:{id:`lane_${i}`,lane,label:tr(LANE_LABEL[lane])},position:{x:X0+i*LANE_W,y:62},classes:'lane-label'}));
familyMeta.bands.forEach(y=>{
  const py=familyMeta.bandMeta[y].top;
  elements.push({data:{id:`band_${y}`,label:`${y}–${y+24}`},position:{x:92,y:py},classes:'year-label'});
  elements.push({data:{id:`band_r_${y}`},position:{x:DECO_RIGHT,y:py},classes:'guide-anchor'});
  elements.push({data:{id:`band_line_${y}`,source:`band_${y}`,target:`band_r_${y}`},classes:'year-guide'});
});

const cy=cytoscape({
  container:document.getElementById('cy'),elements,layout:{name:'preset'},wheelSensitivity:.18,minZoom:.18,maxZoom:2.5,autoungrabify:true,boxSelectionEnabled:false,
  style:[
    {selector:'node.person',style:{'shape':'round-rectangle','width':NODE_W,'height':NODE_H,'background-color':'#2a231b','background-opacity':1,'border-width':2,'border-color':'data(originColor)','underlay-color':'data(currentColor)','underlay-opacity':.88,'underlay-padding':4,'label':'data(label)','color':'#eee4ce','font-family':'IBM Plex Sans','font-size':10.5,'font-weight':500,'text-valign':'center','text-halign':'center','text-wrap':'wrap','text-max-width':150,'line-height':1.25,'z-index':10}},
    {selector:'node.person[confidence="medium"]',style:{'border-style':'dashed'}},
    {selector:'node.person:selected',style:{'width':176,'height':60,'background-color':'#33291f','font-size':11,'underlay-padding':6}},
    {selector:'node.union-node',style:{'shape':'diamond','width':7,'height':7,'background-color':'#c9a45f','border-width':0,'label':'','z-index':7}},
    {selector:'node.lane-label',style:{'shape':'rectangle','width':1,'height':1,'background-opacity':0,'border-width':0,'label':'data(label)','font-family':'Newsreader','font-style':'italic','font-size':14,'color':'#c9a45f','events':'no','z-index':1}},
    {selector:'node.year-label',style:{'shape':'rectangle','width':1,'height':1,'background-opacity':0,'border-width':0,'label':'data(label)','font-family':'IBM Plex Mono','font-size':9,'color':'#8d806b','text-halign':'right','text-margin-x':-12,'events':'no','z-index':0}},
    {selector:'node.guide-anchor',style:{'width':1,'height':1,'background-opacity':0,'border-width':0,'events':'no','z-index':0}},
    {selector:'edge.year-guide',style:{'width':.55,'line-color':'#3b3126','line-style':'dotted','opacity':.58,'events':'no','z-index':0}},
    // Parent-pair arms first move sideways into the central gutter, then vertically.
    // This keeps them from visually attaching to unrelated cards in intervening rows.
    {selector:'edge.family-arm',style:{'curve-style':'taxi','taxi-direction':'horizontal','taxi-turn':'50%','taxi-turn-min-distance':10,'width':1.45,'line-color':'#9f9580','opacity':.9,'z-index':4}},
    {selector:'edge.family-arm.arm-spouse',style:{'line-color':'#c9a45f','line-style':'dashed'}},
    {selector:'edge.family-arm.arm-partner',style:{'line-color':'#c9a45f','line-style':'dotted'}},
    {selector:'edge.family-child, edge.single-parent',style:{'curve-style':'taxi','taxi-direction':'vertical','taxi-turn':'52%','taxi-turn-min-distance':12,'width':1.7,'line-color':'#c8bea7','target-arrow-color':'#c8bea7','target-arrow-shape':'triangle','arrow-scale':.65,'opacity':.96,'z-index':4}},
    {selector:'edge.orig-edge',style:{'curve-style':'bezier','opacity':.7,'z-index':2}},
    {selector:'edge.rel-parent',style:{'width':1.2,'line-color':'#b8ad96','target-arrow-color':'#b8ad96','target-arrow-shape':'triangle','arrow-scale':.6}},
    {selector:'edge.rel-spouse',style:{'curve-style':'straight','width':1.65,'line-color':'#c9a45f','line-style':'dashed'}},
    {selector:'edge.rel-partner',style:{'curve-style':'straight','width':1.35,'line-color':'#c9a45f','line-style':'dotted'}},
    {selector:'edge.rel-sibling,edge.rel-kin',style:{'width':1.1,'line-color':'#7e90a8','line-style':'dotted'}},
    {selector:'edge.rel-social',style:{'width':.9,'line-color':'#71685e','line-style':'dashed','opacity':.48}},
    {selector:'.dim',style:{'opacity':.08}},
    {selector:'.focus-edge',style:{'opacity':1,'width':2.2}},
    {selector:'.focus-node',style:{'opacity':1}},
    {selector:'.hidden-filter',style:{'display':'none'}},
    {selector:'.hidden-view',style:{'display':'none'}}
  ]
});

function unionPosition(u,positions){
  const ps=u.parents.map(id=>positions[id]).filter(Boolean), cs=u.children.map(id=>positions[id]).filter(Boolean);
  const x=ps.length?ps.reduce((s,p)=>s+p.x,0)/ps.length:(cs[0]?.x||0);
  const py=ps.length?Math.max(...ps.map(p=>p.y)):0, cyy=cs.length?Math.min(...cs.map(p=>p.y)):py+80;
  return {x,y:Math.min(cyy-28,py+36)};
}
function applyPresetPositions(kind){
  const source=kind==='timeline'?TIMELINE_PRESET:FAMILY_PRESET;
  const positions={};
  PEOPLE.forEach(p=>{const q=source[p.id];positions[p.id]={x:q.x,y:q.y};});

  // Build a complete fresh position map for every node in the view. Running a real
  // preset layout is more reliable than only assigning node.position() after COSE,
  // because it formally replaces the previous layout state.
  const nodePositions={};
  PEOPLE.forEach(p=>{nodePositions[p.id]={x:positions[p.id].x,y:positions[p.id].y};});
  unionMap.forEach(u=>{nodePositions[u.id]=unionPosition(u,positions);});
  cy.nodes('.lane-label').forEach((n,i)=>{nodePositions[n.id()]={x:X0+i*LANE_W,y:62};});
  familyMeta.bands.forEach(y=>{
    const py=kind==='family'?familyMeta.bandMeta[y].top:110+(y-minYear)*7.4;
    nodePositions[`band_${y}`]={x:92,y:py};
    nodePositions[`band_r_${y}`]={x:DECO_RIGHT,y:py};
    if(kind!=='family')cy.getElementById(`band_${y}`).data('label',String(y));
  });

  const preset=cy.layout({
    name:'preset',animate:false,fit:false,padding:0,
    positions:node=>{
      const q=nodePositions[node.id()];
      return q?{x:q.x,y:q.y}:{x:node.position('x'),y:node.position('y')};
    }
  });
  preset.run();
}
function restoreBandLabels(){familyMeta.bands.forEach(y=>cy.getElementById(`band_${y}`).data('label',`${y}–${y+24}`));}

function logicalVisiblePeople(){return cy.nodes('.person').filter(n=>!n.hasClass('hidden-filter')&&!n.hasClass('hidden-view'))}
function isPersonVisible(id){const n=cy.getElementById(id);return n.length&&!n.hasClass('hidden-filter')&&!n.hasClass('hidden-view')}
function applyView(){
  const token=++viewChangeToken;
  // Stop any animation or force-directed layout left by the previous view before
  // touching positions. This is the key to making Family Tree a true reset.
  try{cy.stop();}catch(e){}
  if(activeNetworkLayout){try{activeNetworkLayout.stop();}catch(e){} activeNetworkLayout=null;}

  cy.elements().removeClass('hidden-view');
  if(currentView==='network'){
    cy.nodes('.union-node,.lane-label,.year-label,.guide-anchor').addClass('hidden-view');cy.edges('.family-helper,.year-guide').addClass('hidden-view');
    cy.edges('.orig-edge').removeClass('hidden-view');
    const eles=cy.elements().filter(e=>e.isNode()?e.hasClass('person')&&!e.hasClass('hidden-filter'):e.hasClass('orig-edge')&&!e.hasClass('hidden-filter'));
    if(eles.nodes().length){
      activeNetworkLayout=eles.layout({name:'cose',animate:false,fit:false,padding:70,nodeRepulsion:780000,idealEdgeLength:145,edgeElasticity:80,gravity:.16,numIter:900,randomize:true});
      activeNetworkLayout.one('layoutstop',()=>{if(token===viewChangeToken&&currentView==='network'){activeNetworkLayout=null;fitReadable();}});
      activeNetworkLayout.run();
    }
  }else{
    cy.nodes('.union-node,.lane-label,.year-label,.guide-anchor').removeClass('hidden-view');cy.edges('.family-helper,.year-guide').removeClass('hidden-view');
    cy.edges('.orig-edge').addClass('hidden-view');
    // Show a direct marriage/partner line only when the pair does NOT already have a
    // parental union junction. For parent couples the junction itself represents the union,
    // which avoids duplicate diagonals across the family tree.
    cy.edges('.orig-edge.rel-spouse,.orig-edge.rel-partner').forEach(e=>{
      const key=[e.source().id(),e.target().id()].sort().join('__');
      if(!unionPairKeys.has(key))e.removeClass('hidden-view');
    });
    applyPresetPositions(currentView);
    if(currentView==='family')restoreBandLabels();
    updateHelperVisibility();
    // Re-apply once on the next frame. This defeats any final queued position write
    // from a force-directed layout that was stopped in the same click.
    requestAnimationFrame(()=>{
      if(token!==viewChangeToken||currentView==='network')return;
      applyPresetPositions(currentView);
      if(currentView==='family')restoreBandLabels();
      requestAnimationFrame(()=>{if(token===viewChangeToken&&currentView!=='network')fitReadable();});
    });
  }
  document.querySelectorAll('.view-tab').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));
  document.getElementById('viewHint').textContent=currentView==='family'?I18N[lang].hintFamily:currentView==='timeline'?I18N[lang].hintTimeline:I18N[lang].hintNetwork;
  clearFocus(false);updateStats();
}
function updateHelperVisibility(){
  cy.nodes('.union-node').forEach(n=>{const u=[...unionMap.values()].find(x=>x.id===n.id());const anyParent=u.parents.some(isPersonVisible),anyChild=u.children.some(isPersonVisible);n.toggleClass('hidden-filter',!(anyParent&&anyChild));});
  cy.edges('.family-helper').forEach(e=>{const s=e.source(),t=e.target();let show=true;if(s.hasClass('person'))show&=isPersonVisible(s.id());if(t.hasClass('person'))show&=isPersonVisible(t.id());if(s.hasClass('union-node'))show&=!s.hasClass('hidden-filter');if(t.hasClass('union-node'))show&=!t.hasClass('hidden-filter');e.toggleClass('hidden-filter',!show);});
}

function refreshUI(){
  const t=I18N[lang];document.documentElement.lang=lang;document.title=t.title;document.getElementById('title').textContent=t.title;document.getElementById('subtitle').textContent=t.subtitle;
  document.getElementById('search').placeholder=t.search;document.getElementById('fit').textContent=t.overview;document.getElementById('reset').textContent=t.reset;document.getElementById('legendToggle').textContent=t.legendButton;

  const scope=document.getElementById('scope'),branch=document.getElementById('branch'),faith=document.getElementById('faith'),focus=document.getElementById('focusMode');
  const oldScope=scope.value||'narrative',oldBranch=branch.value||'all',oldFaith=faith.value||'all',oldFocus=focus.value||'immediate';
  scope.innerHTML=`<option value="all">${t.scopeAll}</option><option value="narrative">${t.scopeNarrative}</option><option value="historical">${t.scopeHistorical}</option>`;
  branch.innerHTML=`<option value="all">${t.branchAll}</option><option value="komneni">${t.branchKomneni}</option><option value="ibrahim">${t.branchIbrahim}</option><option value="village">${t.branchVillage}</option><option value="vosk">${t.branchVosk}</option><option value="benishi">${t.branchBenishi}</option><option value="bilali">${t.branchBilali}</option><option value="history">${t.branchHistory}</option>`;
  faith.innerHTML=`<option value="all">${t.faithAll}</option><option value="christian">${t.christian}</option><option value="muslim">${t.muslim}</option><option value="jewish">${t.jewish}</option><option value="other">${t.other}</option>`;
  focus.innerHTML=`<option value="immediate">${t.focusImmediate}</option><option value="ancestors">${t.focusAncestors}</option><option value="descendants">${t.focusDescendants}</option><option value="all">${t.focusAll}</option>`;
  scope.value=oldScope;branch.value=oldBranch;faith.value=oldFaith;focus.value=oldFocus;activeFocusMode=focus.value;
  document.getElementById('emptyHint').textContent=t.empty;renderLegend();
  cy.nodes('.person').forEach(n=>{const p=personById(n.id());n.data('label',nodeLabel(p));});cy.nodes('.lane-label').forEach(n=>n.data('label',tr(LANE_LABEL[n.data('lane')])));
  document.getElementById('viewHint').textContent=currentView==='family'?t.hintFamily:currentView==='timeline'?t.hintTimeline:t.hintNetwork;
  if(activePersonId)openPanel(cy.getElementById(activePersonId));updateStats();
}

const panel=document.getElementById('panel'),panelInner=document.getElementById('panel-inner');
function faithHtml(p){if(p.religionOrigin===p.religionCurrent)return`<div class="faith-line"><span class="faith-dot" style="background:${faithColor(p.religionCurrent)}"></span><span>${religionLabel(p.religionCurrent)}</span></div>`;return`<div class="faith-line"><span class="faith-dot" style="background:${faithColor(p.religionOrigin)}"></span><span>${religionLabel(p.religionOrigin)}</span><span>→</span><span class="faith-dot" style="background:${faithColor(p.religionCurrent)}"></span><span>${religionLabel(p.religionCurrent)}${p.religionChangeYear?` (${p.religionChangeYear})`:''}</span></div>`}
function connectedRelations(id){return RELATIONS.filter(r=>r.source===id||r.target===id)}
function openPanel(node){
  if(!node||!node.length)return;const p=personById(node.id());if(!p)return;activePersonId=p.id;const t=I18N[lang];
  const rels=connectedRelations(p.id).map(r=>{const otherId=r.source===p.id?r.target:r.source,other=personById(otherId);if(!other)return'';const directional=r.type==='parent'?(r.source===p.id?' → ':' ← '):' · ';return`<button class="rel-btn" data-focus="${escapeHtml(otherId)}"><strong>${relationshipLabel(r.type)}</strong>${directional}${escapeHtml(other.flag+' '+other.name)}${r.label?`<br><span style="color:var(--parchment-dim)">${escapeHtml(r.label)}</span>`:''}</button>`}).join('');
  const aliases=p.aliases.length?`<div class="field"><div class="label">${t.aliases}</div><div class="value">${escapeHtml(p.aliases.join(' · '))}${p.nameChangeYear?` · ${p.nameChangeYear}`:''}</div></div>`:'';
  panelInner.innerHTML=`<button class="close" id="closePanel">${t.close}</button><h2>${escapeHtml(p.flag+' '+p.name)}</h2><div class="person-sub">${escapeHtml(p.family)} · ${p.role}</div>
  <div class="field"><div class="label">${t.born}</div><div class="value">${yearText(p.birthYear,p.birthApprox)}</div></div>${p.deathYear?`<div class="field"><div class="label">${t.died}</div><div class="value">${yearText(p.deathYear,p.deathApprox)}</div></div>`:''}
  <div class="field"><div class="label">${t.birthplace}</div><div class="value">${escapeHtml(textVal(p.birthplace,PLACE))}</div></div><div class="field"><div class="label">${t.faithLabel}</div><div class="value">${faithHtml(p)}</div></div>
  <div class="field"><div class="label">${t.nationality}</div><div class="value">${escapeHtml(textVal(p.nationality,NATION))}</div></div>${aliases}<div class="field"><div class="label">${t.notes}</div><div class="value">${escapeHtml(p.notes)}</div></div><div class="field"><div class="label">${t.refs}</div><div class="value refs">${escapeHtml(p.pages)}</div></div>
  <div class="field"><div class="label">${t.focusLabel}</div><div class="focus-tools"><button class="focus-btn ${activeFocusMode==='immediate'?'active':''}" data-fmode="immediate">${t.focusImmediate}</button><button class="focus-btn ${activeFocusMode==='ancestors'?'active':''}" data-fmode="ancestors">${t.focusAncestors}</button><button class="focus-btn ${activeFocusMode==='descendants'?'active':''}" data-fmode="descendants">${t.focusDescendants}</button><button class="focus-btn ${activeFocusMode==='all'?'active':''}" data-fmode="all">${t.focusAll}</button></div></div>
  <div class="field"><div class="label">${t.relations}</div><div class="relation-list">${rels||'—'}</div></div>`;
  panel.classList.add('open');document.getElementById('closePanel').onclick=()=>closePanel();panelInner.querySelectorAll('[data-focus]').forEach(btn=>btn.onclick=()=>focusPerson(btn.dataset.focus));panelInner.querySelectorAll('[data-fmode]').forEach(btn=>btn.onclick=()=>{activeFocusMode=btn.dataset.fmode;document.getElementById('focusMode').value=activeFocusMode;applyFocus(p.id);openPanel(node)});cy.resize();
}
function closePanel(){panel.classList.remove('open');activePersonId=null;clearFocus(true);cy.resize()}
function focusPerson(id){const n=cy.getElementById(id);if(!n.length||n.hasClass('hidden-filter'))return;cy.nodes('.person').unselect();n.select();activePersonId=id;applyFocus(id);cy.animate({center:{eles:n},zoom:Math.max(cy.zoom(),.72)},{duration:220});openPanel(n)}

function parentsOf(id){return RELATIONS.filter(r=>r.type==='parent'&&r.target===id).map(r=>r.source)}
function childrenOf(id){return RELATIONS.filter(r=>r.type==='parent'&&r.source===id).map(r=>r.target)}
function traversal(start,direction){const seen=new Set([start]),queue=[start];while(queue.length){const id=queue.shift();const next=direction==='up'?parentsOf(id):childrenOf(id);next.forEach(x=>{if(!seen.has(x)){seen.add(x);queue.push(x)}})}return seen}
function allConnected(start){const seen=new Set([start]),queue=[start];while(queue.length){const id=queue.shift();RELATIONS.filter(r=>r.source===id||r.target===id).forEach(r=>{const x=r.source===id?r.target:r.source;if(!seen.has(x)){seen.add(x);queue.push(x)}})}return seen}
function focusSet(id){
  if(activeFocusMode==='ancestors'){const s=traversal(id,'up');connectedRelations(id).filter(r=>['spouse','partner'].includes(r.type)).forEach(r=>s.add(r.source===id?r.target:r.source));return s;}
  if(activeFocusMode==='descendants'){const s=traversal(id,'down');connectedRelations(id).filter(r=>['spouse','partner'].includes(r.type)).forEach(r=>s.add(r.source===id?r.target:r.source));return s;}
  if(activeFocusMode==='all')return allConnected(id);
  const s=new Set([id]);connectedRelations(id).forEach(r=>s.add(r.source===id?r.target:r.source));return s;
}
function applyFocus(id){
  clearFocus(false);const keep=focusSet(id);cy.nodes('.person').forEach(n=>{if(!keep.has(n.id()))n.addClass('dim');else n.addClass('focus-node')});
  cy.edges().forEach(e=>{if(e.hasClass('year-guide'))return;const s=e.source(),t=e.target();let relevant=false;if(s.hasClass('person')&&t.hasClass('person'))relevant=keep.has(s.id())&&keep.has(t.id());else if(s.hasClass('union-node')||t.hasClass('union-node')){const u=s.hasClass('union-node')?s:t,info=[...unionMap.values()].find(x=>x.id===u.id());relevant=info&&[...info.parents,...info.children].some(x=>keep.has(x));}if(!relevant)e.addClass('dim');else e.addClass('focus-edge')});
}
function clearFocus(unselect=false){cy.$('.dim,.focus-edge,.focus-node').removeClass('dim focus-edge focus-node');if(unselect)cy.nodes('.person').unselect()}

cy.on('tap','node.person',evt=>{const n=evt.target;cy.nodes('.person').unselect();n.select();activePersonId=n.id();applyFocus(n.id());openPanel(n)});
cy.on('tap',evt=>{if(evt.target===cy){closePanel()}});

function applyFilters(){
  const scope=document.getElementById('scope').value,branch=document.getElementById('branch').value,faith=document.getElementById('faith').value,q=document.getElementById('search').value.trim().toLowerCase();
  cy.nodes('.person').forEach(n=>{const p=personById(n.id()),scopeOk=scope==='all'||(scope==='historical'?p.role==='historical':p.role!=='historical'),branchOk=branch==='all'||branchFor(p)===branch,faithOk=faith==='all'||p.religionOrigin===faith||p.religionCurrent===faith,hay=[p.name,...p.aliases,p.family,p.notes,textVal(p.birthplace,PLACE),textVal(p.nationality,NATION)].join(' ').toLowerCase();n.toggleClass('hidden-filter',!(scopeOk&&branchOk&&faithOk&&(!q||hay.includes(q))));});
  cy.edges('.orig-edge').forEach(e=>e.toggleClass('hidden-filter',!(isPersonVisible(e.source().id())&&isPersonVisible(e.target().id()))));updateHelperVisibility();
  if(activePersonId&&!isPersonVisible(activePersonId))closePanel();updateStats();
}
function fitReadable(){
  const visible=logicalVisiblePeople();if(!visible.length)return;cy.fit(visible,80);if(currentView!=='network'){const z=Math.min(cy.zoom()*1.18,.92);cy.zoom({level:z,renderedPosition:{x:document.getElementById('cy').clientWidth/2,y:document.getElementById('cy').clientHeight/2}})}
}
function updateStats(){const t=I18N[lang],visible=logicalVisiblePeople().length,view=currentView==='family'?t.viewFamily:currentView==='timeline'?t.viewTimeline:t.viewNetwork;document.getElementById('stats').textContent=`${visible}/${PEOPLE.length} ${t.visible} · ${RELATIONS.length} ${t.links} · ${view}`}

// UI events
document.querySelectorAll('.view-tab').forEach(btn=>btn.addEventListener('click',()=>{currentView=btn.dataset.view;applyView()}));
document.getElementById('search').addEventListener('input',()=>{applyFilters();const q=document.getElementById('search').value.trim();if(q){const m=logicalVisiblePeople();if(m.length)cy.animate({fit:{eles:m,padding:95}},{duration:190})}});
['scope','branch','faith'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{applyFilters();if(currentView==='network')applyView();else setTimeout(()=>fitReadable(),10)}));
document.getElementById('focusMode').addEventListener('change',e=>{activeFocusMode=e.target.value;if(activePersonId){applyFocus(activePersonId);openPanel(cy.getElementById(activePersonId))}});
document.getElementById('legendToggle').addEventListener('click',()=>document.getElementById('legend').classList.toggle('open'));
document.getElementById('fit').addEventListener('click',fitReadable);
document.getElementById('reset').addEventListener('click',()=>{document.getElementById('search').value='';document.getElementById('scope').value='narrative';document.getElementById('branch').value='all';document.getElementById('faith').value='all';document.getElementById('focusMode').value='immediate';activeFocusMode='immediate';currentView='family';applyFilters();applyView();closePanel();});
document.getElementById('language').addEventListener('change',e=>{lang=e.target.value;refreshUI();applyFilters()});window.addEventListener('resize',()=>{cy.resize()});

// Initial state: narrative characters first. Historical/backstory figures remain one click away.
document.getElementById('scope').innerHTML='<option value="narrative">narrative</option>';document.getElementById('scope').value='narrative';
refreshUI();document.getElementById('scope').value='narrative';document.getElementById('branch').value='all';document.getElementById('faith').value='all';document.getElementById('focusMode').value='immediate';applyFilters();applyView();setTimeout(fitReadable,90);

</script>
</body>
</html>
