<style>

}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--ink);color:var(--parchment);font-family:var(--font-body);overflow:hidden}

.sub{font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--parchment-dim);margin-top:4px;max-width:920px}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px}
.control{background:var(--ink-panel);border:1px solid var(--ink-line);color:var(--parchment);height:33px;border-radius:4px;padding:0 9px;font-size:12px}
#search{width:min(255px,44vw)} #search::placeholder{color:var(--parchment-dim)} select.control{cursor:pointer}
button.control{cursor:pointer;transition:.14s ease} button.control:hover{border-color:var(--gold);background:var(--ink-panel-2)}
.view-tabs{height:33px;display:flex;border:1px solid var(--ink-line);border-radius:4px;overflow:hidden;background:var(--ink-panel)}
.view-tab{border:0;border-right:1px solid var(--ink-line);background:transparent;color:var(--parchment-dim);padding:0 11px;cursor:pointer;font-size:11.5px}
.view-tab:last-child{border-right:0}.view-tab:hover{color:var(--parchment)}.view-tab.active{background:#332719;color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
#main{flex:1;min-height:0;display:flex;position:relative} #cy{flex:1;min-width:0;min-height:0}
#panel{width:0;overflow:hidden;flex:none;border-left:1px solid var(--ink-line);background:var(--ink-panel);transition:width .18s ease;position:relative;z-index:7}
#panel.open{width:350px} #panel-inner{width:350px;height:100%;overflow:auto;padding:22px 20px 34px}
#panel h2{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:22px;line-height:1.12;margin:0 38px 4px 0}
.person-sub{color:var(--parchment-dim);font-size:10.5px;font-family:var(--font-mono);line-height:1.5}.close{position:absolute;right:10px;top:10px;border:0;background:transparent;color:var(--parchment-dim);cursor:pointer;font-size:12px}
.field{margin-top:14px}.label{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--parchment-dim)}.value{font-size:13px;line-height:1.48;margin-top:3px}
.faith-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.faith-dot{width:9px;height:9px;border-radius:50%;display:inline-block}.refs{font-family:var(--font-mono);font-size:10px;color:var(--gold)}
.relation-list{display:flex;flex-direction:column;gap:5px;margin-top:6px}.rel-btn{border:1px solid var(--ink-line);background:var(--ink);color:var(--parchment);border-radius:4px;padding:7px 8px;text-align:left;cursor:pointer;font-size:11.5px;line-height:1.3}.rel-btn:hover{border-color:var(--gold)}
.focus-tools{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.focus-btn{border:1px solid var(--ink-line);background:var(--ink);color:var(--parchment-dim);border-radius:4px;padding:6px;cursor:pointer;font-size:10.5px}.focus-btn:hover,.focus-btn.active{border-color:var(--gold);color:var(--gold)}
.empty-hint{font-family:var(--font-display);font-style:italic;color:var(--parchment-dim);padding:22px}
#legend{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(33,27,21,.96);border:1px solid var(--ink-line);border-radius:5px;padding:11px 13px;font-size:11px;line-height:1.6;backdrop-filter:blur(4px);max-width:330px;box-shadow:0 8px 26px rgba(0,0,0,.22);display:none}
#legend.open{display:block} #legend .title{font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}.legend-row{display:flex;align-items:center;gap:7px}.legend-card{width:25px;height:13px;border:2px solid var(--christian);border-radius:3px;background:var(--ink-panel-2);display:inline-block;box-shadow:0 0 0 2px var(--muslim);margin:2px 3px 2px 2px}.swatch{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}.legend-line{width:22px;height:0;display:inline-block;flex:none;border-top:2px solid var(--family-line)}.legend-line.marriage{border-top:2px dashed var(--gold)}.legend-line.kin{border-top:2px dotted var(--kin)}.legend-line.social{border-top:1px dashed var(--social)}.legend-note{margin-top:5px;color:var(--parchment-dim);font-size:10px}
#stats{position:absolute;right:12px;bottom:12px;z-index:4;font-family:var(--font-mono);font-size:9.5px;color:var(--parchment-dim);background:rgba(23,19,15,.82);border:1px solid rgba(59,49,38,.6);padding:5px 7px;border-radius:3px;pointer-events:none}
#viewHint{position:absolute;left:12px;top:12px;z-index:4;font-family:var(--font-mono);font-size:9px;color:#8f826b;background:rgba(23,19,15,.73);padding:4px 6px;border-radius:3px;pointer-events:none}
#hoverTip{position:absolute;z-index:12;display:none;pointer-events:none;max-width:260px;background:rgba(33,27,21,.98);border:1px solid var(--gold);border-radius:5px;padding:7px 9px;font-size:11px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.32)}
#hoverTip strong{display:block;font-family:var(--font-display);font-size:13px;margin-bottom:2px}#hoverTip .tip-sub{color:var(--parchment-dim);font-family:var(--font-mono);font-size:9px}
.export-wrap{position:relative}.export-menu{display:none;position:absolute;right:0;top:37px;z-index:15;min-width:142px;background:var(--ink-panel);border:1px solid var(--ink-line);border-radius:5px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.35)}.export-menu.open{display:flex;flex-direction:column;gap:4px}.export-option{border:0;background:transparent;color:var(--parchment);text-align:left;border-radius:3px;padding:8px 9px;cursor:pointer;font-size:11px}.export-option:hover{background:var(--ink-panel-2);color:var(--gold)}
#toast{position:absolute;right:14px;top:14px;z-index:20;opacity:0;transform:translateY(-5px);pointer-events:none;background:var(--ink-panel-2);border:1px solid var(--gold);color:var(--parchment);border-radius:4px;padding:7px 10px;font-size:10.5px;transition:opacity .16s ease,transform .16s ease}#toast.show{opacity:1;transform:translateY(0)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}.tool-icon{width:14px;height:14px;display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#findConnection.active{border-color:var(--gold);color:var(--gold);background:#332719}
.connection-box{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:16;width:min(760px,calc(100% - 24px));background:rgba(33,27,21,.985);border:1px solid var(--ink-line);border-radius:6px;padding:13px 14px 12px;box-shadow:0 10px 32px rgba(0,0,0,.38);backdrop-filter:blur(5px)}
.connection-box.open{display:block}.connection-title{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:17px;margin:0 32px 9px 0}.connection-close{position:absolute;right:8px;top:7px;border:0;background:transparent;color:var(--parchment-dim);cursor:pointer;padding:5px;font-size:15px}
.connection-grid{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:7px;align-items:end}.connection-field{display:flex;flex-direction:column;gap:4px;min-width:0}.connection-field span{font-family:var(--font-mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--parchment-dim)}.connection-select{width:100%;height:34px;background:var(--ink);border:1px solid var(--ink-line);color:var(--parchment);border-radius:4px;padding:0 7px;font-size:11.5px}
.connection-swap{height:34px;border:1px solid var(--ink-line);border-radius:4px;background:var(--ink);color:var(--parchment-dim);cursor:pointer;font-size:16px}.connection-swap:hover{border-color:var(--gold);color:var(--gold)}.connection-actions{display:flex;gap:6px;margin-top:8px}.connection-action{border:1px solid var(--ink-line);background:var(--ink);color:var(--parchment);border-radius:4px;padding:7px 10px;cursor:pointer;font-size:10.5px}.connection-action.primary{border-color:#6f5a36;color:var(--gold)}.connection-action:hover{border-color:var(--gold)}
.connection-result{margin-top:9px;padding-top:9px;border-top:1px solid var(--ink-line);font-size:11px;line-height:1.45}.connection-result:empty{display:none}.connection-meta{font-family:var(--font-mono);font-size:9px;color:var(--parchment-dim);margin-bottom:7px}.connection-path{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.path-person{border:1px solid var(--ink-line);background:var(--ink);border-radius:4px;padding:5px 7px;font-weight:600}.path-relation{color:var(--gold);font-size:10px}.connection-error{color:var(--parchment-dim);font-style:italic}
@media(max-width:820px){header{padding:9px 9px 8px}.head-row{gap:7px}h1{font-size:20px}.sub{font-size:8.8px}.toolbar{gap:4px;margin-top:7px}.control{height:30px;font-size:10.5px;padding:0 7px}#search{width:100%;flex:1 1 100%}.view-tabs{height:30px}.view-tab{font-size:10px;padding:0 7px}#stats{display:none}#panel{position:absolute;right:0;top:0;bottom:0;box-shadow:-8px 0 24px rgba(0,0,0,.3)}#panel.open{width:min(90vw,350px)}#legend{left:8px;bottom:8px;max-width:88vw}.connection-box{top:8px;width:calc(100% - 16px);padding:11px}.connection-grid{grid-template-columns:1fr 32px 1fr}.connection-select{font-size:10.5px}.icon-btn .btn-label{display:none}.icon-btn{width:34px;padding:0}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="head-row">
    <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
    <select id="language" class="control" aria-label="Language"><option value="sq">Shqip</option><option value="it">Italiano</option><option value="en">English</option></select>
  </div>
  <div class="toolbar">
    <div class="view-tabs" id="viewTabs">
      <button class="view-tab active" data-view="family" type="button"></button>
      <button class="view-tab" data-view="timeline" type="button"></button>
      <button class="view-tab" data-view="network" type="button"></button>
    </div>
    <input id="search" class="control" type="search" autocomplete="off">
    <select id="scope" class="control"></select>
    <select id="branch" class="control"></select>
    <select id="faith" class="control"></select>
    <select id="focusMode" class="control"></select>
    <button id="legendToggle" class="control" type="button"></button>
    <button id="fit" class="control icon-btn" type="button"></button>
    <button id="findConnection" class="control icon-btn" type="button" aria-expanded="false"></button>
    <button id="share" class="control icon-btn" type="button"></button>
    <div class="export-wrap">
      <button id="exportToggle" class="control" type="button" aria-haspopup="true" aria-expanded="false"></button>
      <div id="exportMenu" class="export-menu" role="menu">
        <button id="exportPng" class="export-option" type="button" role="menuitem"></button>
        <button id="exportSvg" class="export-option" type="button" role="menuitem"></button>
      </div>
    </div>
    <button id="reset" class="control" type="button"></button>
  </div>
</header>
<div id="main">
  <div id="cy"></div><div id="viewHint"></div><div id="legend"></div><div id="stats"></div><div id="hoverTip" role="tooltip"></div><div id="toast" aria-live="polite"></div>
  <section id="connectionBox" class="connection-box" aria-hidden="true" aria-labelledby="connectionTitle">
    <button id="connectionClose" class="connection-close" type="button" aria-label="Close">✕</button>
    <div id="connectionTitle" class="connection-title"></div>
    <div class="connection-grid">
      <label class="connection-field"><span id="connALabel"></span><select id="connA" class="connection-select"></select></label>
      <button id="connSwap" class="connection-swap" type="button" aria-label="Swap">⇄</button>
      <label class="connection-field"><span id="connBLabel"></span><select id="connB" class="connection-select"></select></label>
    </div>
    <div class="connection-actions"><button id="connFind" class="connection-action primary" type="button"></button><button id="connClear" class="connection-action" type="button"></button></div>
    <div id="connectionResult" class="connection-result" aria-live="polite"></div>
  </section>
  <aside id="panel"><div id="panel-inner"><div class="empty-hint" id="emptyHint"></div></div></aside>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>

// people (for example Jorgo Mavromatisi / Sheba) and makes the view read like a genealogy.
function rowsForFamilyBand(arr){
  const byId=new Map(arr.map(p=>[p.id,p]));
  const unused=new Set(arr.map(p=>p.id));
  const rows=[];
  const pairRels=RELATIONS
    .filter(r=>(r.type==='spouse'||r.type==='partner')&&byId.has(r.source)&&byId.has(r.target))
    .slice().sort((a,b)=>{
      const aa=Math.min(byId.get(a.source).birthYear,byId.get(a.target).birthYear);
      const bb=Math.min(byId.get(b.source).birthYear,byId.get(b.target).birthYear);
      return aa-bb||a.source.localeCompare(b.source);
    });
  pairRels.forEach(r=>{
    if(!unused.has(r.source)||!unused.has(r.target))return;
    rows.push([byId.get(r.source),byId.get(r.target)]); // source left, target right
    unused.delete(r.source);unused.delete(r.target);
  });

  for(let i=0;i<singles.length;i+=2)rows.push(singles.slice(i,i+2));

function unionPosition(u,positions){
  const ps=u.parents.map(id=>positions[id]).filter(Boolean), cs=u.children.map(id=>positions[id]).filter(Boolean);
  const x=ps.length?ps.reduce((s,p)=>s+p.x,0)/ps.length:(cs[0]?.x||0);
  const py=ps.length?Math.max(...ps.map(p=>p.y)):0, cyy=cs.length?Math.min(...cs.map(p=>p.y)):py+80;
  return {x,y:Math.min(cyy-28,py+36)};
}
function applyPresetPositions(kind){
  const source=kind==='timeline'?TIMELINE_PRESET:FAMILY_PRESET;
  const positions={};
  PEOPLE.forEach(p=>{const q=source[p.id];positions[p.id]={x:q.x,y:q.y};});

  // Build a complete fresh position map for every node in the view. Running a real
  // preset layout is more reliable than only assigning node.position() after COSE,
  // because it formally replaces the previous layout state.
  const nodePositions={};
  PEOPLE.forEach(p=>{nodePositions[p.id]={x:positions[p.id].x,y:positions[p.id].y};});
  unionMap.forEach(u=>{nodePositions[u.id]=unionPosition(u,positions);});
  cy.nodes('.lane-label').forEach(n=>{nodePositions[n.id()]={x:laneX(n.data('lane')),y:62};});
  familyMeta.bands.forEach(y=>{
    const py=kind==='family'?familyMeta.bandMeta[y].top:110+(y-minYear)*7.4;
    nodePositions[`band_${y}`]={x:92,y:py};
    nodePositions[`band_r_${y}`]={x:DECO_RIGHT,y:py};
    if(kind!=='family')cy.getElementById(`band_${y}`).data('label',String(y));
  });

  const preset=cy.layout({
    name:'preset',animate:false,fit:false,padding:0,
    positions:node=>{
      const q=nodePositions[node.id()];
      return q?{x:q.x,y:q.y}:{x:node.position('x'),y:node.position('y')};
    }
  });
  preset.run();
}

function applyView(){

  try{cy.stop();}catch(e){}
  if(activeNetworkLayout){try{activeNetworkLayout.stop();}catch(e){} activeNetworkLayout=null;}

  cy.elements().removeClass('hidden-view');
  if(currentView==='network'){
    cy.nodes('.union-node,.lane-label,.year-label,.guide-anchor').addClass('hidden-view');cy.edges('.family-helper,.year-guide').addClass('hidden-view');
    cy.edges('.orig-edge').removeClass('hidden-view');
    const eles=cy.elements().filter(e=>e.isNode()?e.hasClass('person')&&!e.hasClass('hidden-filter'):e.hasClass('orig-edge')&&!e.hasClass('hidden-filter'));
    if(eles.nodes().length){

      activeNetworkLayout.one('layoutstop',()=>{if(token===viewChangeToken&&currentView==='network'){activeNetworkLayout=null;if(activeConnection)highlightConnection(activeConnection,true);else fitReadable();}});

    cy.edges('.orig-edge').addClass('hidden-view');

function updateSemanticZoom(force=false){

    cy.nodes('.person').forEach(n=>{

  p.nodes.forEach((id,i)=>{const person=personById(id);html+=`<span class="path-person">${escapeHtml((person?.flag||'')+' '+(person?.name||id))}</span>`;if(i<p.relations.length)html+=`<span class="path-relation">→ ${escapeHtml(relationPhrase(p.relations[i],id,p.nodes[i+1]))} →</span>`;});
  connectionResult.innerHTML=html+'</div>';
}
function runConnection(from,to,{fit=true,open=true}={}){
  const t=I18N[lang];if(open)openConnectionBox();connA.value=from||'';connB.value=to||'';
  if(!from||!to){connectionResult.innerHTML='';return false;}if(from===to){connectionResult.innerHTML=`<div class="connection-error">${escapeHtml(t.samePerson)}</div>`;return false;}
  const path=findConnectionPath(from,to);if(!path){clearConnectionStyles();activeConnection=null;connectionResult.innerHTML=`<div class="connection-error">${escapeHtml(t.noConnection)}</div>`;scheduleUrlSync();return false;}
  clearFocus(false);activeConnection={from,to,path};highlightConnection(activeConnection,fit);renderConnectionResult(activeConnection);document.getElementById('findConnection').classList.add('active');scheduleUrlSync();return true;
}
function clearConnection(restoreFocus=true){clearConnectionStyles();activeConnection=null;connectionResult.innerHTML='';document.getElementById('findConnection').classList.remove('active');if(restoreFocus&&activePersonId)applyFocus(activePersonId);scheduleUrlSync();}
document.getElementById('findConnection').addEventListener('click',()=>{if(connectionBox.classList.contains('open'))closeConnectionBox();else openConnectionBox();});
document.getElementById('connectionClose').addEventListener('click',closeConnectionBox);
document.getElementById('connSwap').addEventListener('click',()=>{const a=connA.value;connA.value=connB.value;connB.value=a;if(activeConnection)runConnection(connA.value,connB.value,{fit:true,open:false});});
document.getElementById('connFind').addEventListener('click',()=>runConnection(connA.value,connB.value,{fit:true,open:false}));
document.getElementById('connClear').addEventListener('click',()=>clearConnection(true));
[connA,connB].forEach(el=>el.addEventListener('change',()=>{if(activeConnection)clearConnection(true);}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&connectionBox.classList.contains('open'))closeConnectionBox();});

// --- Shareable URL state -----------------------------------------------------
let suppressUrlSync=false,urlSyncTimer=null;
function stateFromHash(){
  const q=new URLSearchParams(location.hash.replace(/^#/,''));
  const pick=(k,allowed,fallback)=>allowed.includes(q.get(k))?q.get(k):fallback;
  return {lang:pick('lang',['sq','it','en'],'sq'),view:pick('view',['family','timeline','network'],'family'),scope:pick('scope',['all','narrative','historical'],'narrative'),branch:q.get('branch')||'all',faith:pick('faith',['all','christian','muslim','jewish','other'],'all'),focus:pick('focus',['immediate','ancestors','descendants','all'],'immediate'),search:q.get('q')||'',person:q.get('person')||null,connFrom:q.get('from')||null,connTo:q.get('to')||null};
}
function syncUrlState(){
  if(suppressUrlSync)return;const q=new URLSearchParams();q.set('lang',lang);q.set('view',currentView);
  q.set('scope',document.getElementById('scope').value||'narrative');q.set('branch',document.getElementById('branch').value||'all');q.set('faith',document.getElementById('faith').value||'all');q.set('focus',activeFocusMode);
  const search=document.getElementById('search').value.trim();if(search)q.set('q',search);if(activePersonId)q.set('person',activePersonId);if(activeConnection){q.set('from',activeConnection.from);q.set('to',activeConnection.to);}
  const next='#'+q.toString();if(location.hash!==next)history.replaceState(null,'',next);
}
function scheduleUrlSync(){clearTimeout(urlSyncTimer);urlSyncTimer=setTimeout(syncUrlState,120);}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>el.classList.remove('show'),1500);}
async function copyShareLink(){
  syncUrlState();const url=location.href;
  try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(url);else throw new Error('fallback');}
  catch(e){const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}ta.remove();}
  showToast(I18N[lang].linkCopied);
}

// --- PNG + vector SVG export -------------------------------------------------
function safeFileBase(){return 'te-jetosh-ne-ishull-'+currentView;}
function triggerDownload(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();}
function exportPNG(){const data=cy.png({full:true,scale:2,bg:'#17130f'});triggerDownload(data,safeFileBase()+'.png');showToast(I18N[lang].exportDone);}
function xmlEscape(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function edgeSvgStyle(e){
  if(e.hasClass('year-guide'))return{stroke:'#3b3126',width:.55,dash:'2 5',opacity:.58,arrow:false};
  if(e.hasClass('family-arm'))return{stroke:e.hasClass('arm-spouse')?'#c9a45f':e.hasClass('arm-partner')?'#c9a45f':'#9f9580',width:1.45,dash:e.hasClass('arm-spouse')?'7 5':e.hasClass('arm-partner')?'2 5':'',opacity:.9,arrow:false};
  if(e.hasClass('family-child')||e.hasClass('single-parent'))return{stroke:'#c8bea7',width:1.7,dash:'',opacity:.96,arrow:true};
  if(e.hasClass('rel-parent'))return{stroke:'#b8ad96',width:1.2,dash:'',opacity:.7,arrow:true};
  if(e.hasClass('rel-spouse'))return{stroke:'#c9a45f',width:1.65,dash:'7 5',opacity:.7,arrow:false};
  if(e.hasClass('rel-partner'))return{stroke:'#c9a45f',width:1.35,dash:'2 5',opacity:.7,arrow:false};
  if(e.hasClass('rel-sibling')||e.hasClass('rel-kin'))return{stroke:'#7e90a8',width:1.1,dash:'2 5',opacity:.7,arrow:false};
  return{stroke:'#71685e',width:.9,dash:'7 5',opacity:.48,arrow:false};
}
function edgeSvgPath(e){
  const a=e.source().position(),b=e.target().position();
  if(e.hasClass('family-arm')){const mx=(a.x+b.x)/2;return`M ${a.x} ${a.y} H ${mx} V ${b.y} H ${b.x}`;}
  if(e.hasClass('family-child')||e.hasClass('single-parent')){const my=(a.y+b.y)/2;return`M ${a.x} ${a.y} V ${my} H ${b.x} V ${b.y}`;}
  return`M ${a.x} ${a.y} L ${b.x} ${b.y}`;
}
function exportSVG(){
  const eles=cy.elements().filter(e=>e.visible()),bb=eles.boundingBox({includeLabels:true,includeOverlays:false,includeUnderlays:true}),pad=70,x0=bb.x1-pad,y0=bb.y1-pad,w=Math.max(1,bb.w+pad*2),h=Math.max(1,bb.h+pad*2);
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x0} ${y0} ${w} ${h}" width="${w}" height="${h}"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#c8bea7"/></marker></defs><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#17130f"/>`;
  eles.edges().forEach(e=>{let st=edgeSvgStyle(e);if(e.hasClass('connection-edge'))st={...st,stroke:'#e0bd73',width:3.2,opacity:1};const op=(e.hasClass('connection-dim')||e.hasClass('dim'))?.055:st.opacity,dash=st.dash?` stroke-dasharray="${st.dash}"`:'',arrow=st.arrow?' marker-end="url(#arrow)"':'';svg+=`<path d="${edgeSvgPath(e)}" fill="none" stroke="${st.stroke}" stroke-width="${st.width}" opacity="${op}"${dash}${arrow}/>`;});
  eles.nodes().forEach(n=>{
    const pos=n.position();
    if(n.hasClass('person')){
      const p=personById(n.id());if(!p)return;const outer=faithColor(p.religionCurrent),inner=faithColor(p.religionOrigin),dash=p.confidence==='medium'?' stroke-dasharray="5 3"':'',nodeOpacity=(n.hasClass('connection-dim')||n.hasClass('dim'))?.055:1;
      svg+=`<g opacity="${nodeOpacity}">`;if(n.hasClass('connection-node'))svg+=`<rect x="${pos.x-NODE_W/2-8}" y="${pos.y-NODE_H/2-8}" width="${NODE_W+16}" height="${NODE_H+16}" rx="11" fill="none" stroke="#e0bd73" stroke-width="3"/>`;
      svg+=`<rect x="${pos.x-NODE_W/2-4}" y="${pos.y-NODE_H/2-4}" width="${NODE_W+8}" height="${NODE_H+8}" rx="9" fill="none" stroke="${outer}" stroke-width="4" opacity=".88"/>`;
      svg+=`<rect x="${pos.x-NODE_W/2}" y="${pos.y-NODE_H/2}" width="${NODE_W}" height="${NODE_H}" rx="7" fill="#2a231b" stroke="${inner}" stroke-width="2"${dash}/>`;
      const lines=nodeLabel(p).split('\n');lines.forEach((line,i)=>{svg+=`<text x="${pos.x}" y="${pos.y+(i-.45)*13}" text-anchor="middle" dominant-baseline="middle" fill="#eee4ce" font-family="IBM Plex Sans, sans-serif" font-size="10.5" font-weight="500">${xmlEscape(line)}</text>`;});svg+='</g>';
    }else if(n.hasClass('union-node')){
      svg+=`<path d="M ${pos.x} ${pos.y-5} L ${pos.x+5} ${pos.y} L ${pos.x} ${pos.y+5} L ${pos.x-5} ${pos.y} Z" fill="#c9a45f"/>`;
    }else if(n.hasClass('lane-label')){
      svg+=`<text x="${pos.x}" y="${pos.y}" text-anchor="middle" fill="#c9a45f" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="14">${xmlEscape(n.data('label'))}</text>`;
    }else if(n.hasClass('year-label')){
      svg+=`<text x="${pos.x-12}" y="${pos.y}" text-anchor="end" fill="#8d806b" font-family="IBM Plex Mono, monospace" font-size="9">${xmlEscape(n.data('label'))}</text>`;
    }
  });
  svg+='</svg>';const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob);triggerDownload(url,safeFileBase()+'.svg');setTimeout(()=>URL.revokeObjectURL(url),1500);showToast(I18N[lang].exportDone);
}

const panel=document.getElementById('panel'),panelInner=document.getElementById('panel-inner');
function faithHtml(p){if(p.religionOrigin===p.religionCurrent)return`<div class="faith-line"><span class="faith-dot" style="background:${faithColor(p.religionCurrent)}"></span><span>${religionLabel(p.religionCurrent)}</span></div>`;return`<div class="faith-line"><span class="faith-dot" style="background:${faithColor(p.religionOrigin)}"></span><span>${religionLabel(p.religionOrigin)}</span><span>→</span><span class="faith-dot" style="background:${faithColor(p.religionCurrent)}"></span><span>${religionLabel(p.religionCurrent)}${p.religionChangeYear?` (${p.religionChangeYear})`:''}</span></div>`}
function connectedRelations(id){return RELATIONS.filter(r=>r.source===id||r.target===id)}
function openPanel(node){
  if(!node||!node.length)return;const p=personById(node.id());if(!p)return;activePersonId=p.id;const t=I18N[lang];
  const rels=connectedRelations(p.id).map(r=>{const otherId=r.source===p.id?r.target:r.source,other=personById(otherId);if(!other)return'';const directional=r.type==='parent'?(r.source===p.id?' → ':' ← '):' · ';return`<button class="rel-btn" data-focus="${escapeHtml(otherId)}"><strong>${relationshipLabel(r.type)}</strong>${directional}${escapeHtml(other.flag+' '+other.name)}${r.label?`<br><span style="color:var(--parchment-dim)">${escapeHtml(r.label)}</span>`:''}</button>`}).join('');
  const aliases=p.aliases.length?`<div class="field"><div class="label">${t.aliases}</div><div class="value">${escapeHtml(p.aliases.join(' · '))}${p.nameChangeYear?` · ${p.nameChangeYear}`:''}</div></div>`:'';
  panelInner.innerHTML=`<button class="close" id="closePanel">${t.close}</button><h2>${escapeHtml(p.flag+' '+p.name)}</h2><div class="person-sub">${escapeHtml(p.family)} · ${p.role}</div>
  <div class="field"><div class="label">${t.born}</div><div class="value">${yearText(p.birthYear,p.birthApprox)}</div></div>${p.deathYear?`<div class="field"><div class="label">${t.died}</div><div class="value">${yearText(p.deathYear,p.deathApprox)}</div></div>`:''}
  <div class="field"><div class="label">${t.birthplace}</div><div class="value">${escapeHtml(textVal(p.birthplace,PLACE))}</div></div><div class="field"><div class="label">${t.faithLabel}</div><div class="value">${faithHtml(p)}</div></div>
  <div class="field"><div class="label">${t.nationality}</div><div class="value">${escapeHtml(textVal(p.nationality,NATION))}</div></div>${aliases}<div class="field"><div class="label">${t.notes}</div><div class="value">${escapeHtml(p.notes)}</div></div><div class="field"><div class="label">${t.refs}</div><div class="value refs">${escapeHtml(p.pages)}</div></div>
  <div class="field"><div class="label">${t.focusLabel}</div><div class="focus-tools"><button class="focus-btn ${activeFocusMode==='immediate'?'active':''}" data-fmode="immediate">${t.focusImmediate}</button><button class="focus-btn ${activeFocusMode==='ancestors'?'active':''}" data-fmode="ancestors">${t.focusAncestors}</button><button class="focus-btn ${activeFocusMode==='descendants'?'active':''}" data-fmode="descendants">${t.focusDescendants}</button><button class="focus-btn ${activeFocusMode==='all'?'active':''}" data-fmode="all">${t.focusAll}</button></div></div>
  <div class="field"><div class="label">${t.relations}</div><div class="relation-list">${rels||'—'}</div></div>`;
  panel.classList.add('open');document.getElementById('closePanel').onclick=()=>closePanel();panelInner.querySelectorAll('[data-focus]').forEach(btn=>btn.onclick=()=>focusPerson(btn.dataset.focus));panelInner.querySelectorAll('[data-fmode]').forEach(btn=>btn.onclick=()=>{clearConnection(false);activeFocusMode=btn.dataset.fmode;document.getElementById('focusMode').value=activeFocusMode;applyFocus(p.id);openPanel(node)});cy.resize();
}
function closePanel(){panel.classList.remove('open');activePersonId=null;clearFocus(true);cy.resize();updateSemanticZoom(true);scheduleUrlSync()}
function focusPerson(id){clearConnection(false);const n=cy.getElementById(id);if(!n.length||n.hasClass('hidden-filter'))return;clearHover();cy.nodes('.person').unselect();n.select();activePersonId=id;applyFocus(id);updateSemanticZoom(true);cy.animate({center:{eles:n},zoom:Math.max(cy.zoom(),.72)},{duration:220});openPanel(n);scheduleUrlSync()}

function parentsOf(id){return RELATIONS.filter(r=>r.type==='parent'&&r.target===id).map(r=>r.source)}
function childrenOf(id){return RELATIONS.filter(r=>r.type==='parent'&&r.source===id).map(r=>r.target)}
function traversal(start,direction){const seen=new Set([start]),queue=[start];while(queue.length){const id=queue.shift();const next=direction==='up'?parentsOf(id):childrenOf(id);next.forEach(x=>{if(!seen.has(x)){seen.add(x);queue.push(x)}})}return seen}
function allConnected(start){const seen=new Set([start]),queue=[start];while(queue.length){const id=queue.shift();RELATIONS.filter(r=>r.source===id||r.target===id).forEach(r=>{const x=r.source===id?r.target:r.source;if(!seen.has(x)){seen.add(x);queue.push(x)}})}return seen}
function focusSet(id){
  if(activeFocusMode==='ancestors'){const s=traversal(id,'up');connectedRelations(id).filter(r=>['spouse','partner'].includes(r.type)).forEach(r=>s.add(r.source===id?r.target:r.source));return s;}
  if(activeFocusMode==='descendants'){const s=traversal(id,'down');connectedRelations(id).filter(r=>['spouse','partner'].includes(r.type)).forEach(r=>s.add(r.source===id?r.target:r.source));return s;}
  if(activeFocusMode==='all')return allConnected(id);
  const s=new Set([id]);connectedRelations(id).forEach(r=>s.add(r.source===id?r.target:r.source));return s;
}
function applyFocus(id){
  clearFocus(false);const keep=focusSet(id);cy.nodes('.person').forEach(n=>{if(!keep.has(n.id()))n.addClass('dim');else n.addClass('focus-node')});
  cy.edges().forEach(e=>{if(e.hasClass('year-guide'))return;const s=e.source(),t=e.target();let relevant=false;if(s.hasClass('person')&&t.hasClass('person'))relevant=keep.has(s.id())&&keep.has(t.id());else if(s.hasClass('union-node')||t.hasClass('union-node')){const u=s.hasClass('union-node')?s:t,info=[...unionMap.values()].find(x=>x.id===u.id());relevant=info&&[...info.parents,...info.children].some(x=>keep.has(x));}if(!relevant)e.addClass('dim');else e.addClass('focus-edge')});
}
function clearFocus(unselect=false){cy.$('.dim,.focus-edge,.focus-node').removeClass('dim focus-edge focus-node');if(unselect)cy.nodes('.person').unselect()}

cy.on('tap','node.person',evt=>{clearHover();const n=evt.target;cy.nodes('.person').unselect();n.select();activePersonId=n.id();if(!activeConnection)applyFocus(n.id());updateSemanticZoom(true);openPanel(n);scheduleUrlSync()});
cy.on('tap',evt=>{if(evt.target===cy){closePanel()}});

function applyFilters(){
  const scope=document.getElementById('scope').value,branch=document.getElementById('branch').value,faith=document.getElementById('faith').value,q=document.getElementById('search').value.trim().toLowerCase();
  cy.nodes('.person').forEach(n=>{const p=personById(n.id()),scopeOk=scope==='all'||(scope==='historical'?p.role==='historical':p.role!=='historical'),branchOk=branch==='all'||branchFor(p)===branch,faithOk=faith==='all'||p.religionOrigin===faith||p.religionCurrent===faith,hay=[p.name,...p.aliases,p.family,p.notes,textVal(p.birthplace,PLACE),textVal(p.nationality,NATION)].join(' ').toLowerCase();n.toggleClass('hidden-filter',!(scopeOk&&branchOk&&faithOk&&(!q||hay.includes(q))));});
  cy.edges('.orig-edge').forEach(e=>e.toggleClass('hidden-filter',!(isPersonVisible(e.source().id())&&isPersonVisible(e.target().id()))));updateHelperVisibility();
  if(activePersonId&&!isPersonVisible(activePersonId))closePanel();updateStats();
}
function fitReadable(){
  const visible=logicalVisiblePeople();if(!visible.length)return;cy.fit(visible,80);if(currentView!=='network'){const z=Math.min(cy.zoom()*1.18,.92);cy.zoom({level:z,renderedPosition:{x:document.getElementById('cy').clientWidth/2,y:document.getElementById('cy').clientHeight/2}})}
}
function updateStats(){const t=I18N[lang],visible=logicalVisiblePeople().length,view=currentView==='family'?t.viewFamily:currentView==='timeline'?t.viewTimeline:t.viewNetwork;document.getElementById('stats').textContent=`${visible}/${PEOPLE.length} ${t.visible} · ${RELATIONS.length} ${t.links} · ${view}`}

// UI events
document.querySelectorAll('.view-tab').forEach(btn=>btn.addEventListener('click',()=>{currentView=btn.dataset.view;applyView();scheduleUrlSync()}));
document.getElementById('search').addEventListener('input',()=>{applyFilters();scheduleUrlSync();const q=document.getElementById('search').value.trim();if(q){const m=logicalVisiblePeople();if(m.length)cy.animate({fit:{eles:m,padding:95}},{duration:190})}});
['scope','branch','faith'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{applyFilters();if(currentView==='network')applyView();else setTimeout(()=>fitReadable(),10);scheduleUrlSync()}));
document.getElementById('focusMode').addEventListener('change',e=>{clearConnection(false);activeFocusMode=e.target.value;if(activePersonId){applyFocus(activePersonId);openPanel(cy.getElementById(activePersonId))}scheduleUrlSync()});
document.getElementById('legendToggle').addEventListener('click',()=>document.getElementById('legend').classList.toggle('open'));
document.getElementById('fit').addEventListener('click',()=>{fitReadable();setTimeout(()=>updateSemanticZoom(true),30)});
document.getElementById('share').addEventListener('click',copyShareLink);
const exportMenu=document.getElementById('exportMenu'),exportToggle=document.getElementById('exportToggle');
exportToggle.addEventListener('click',e=>{e.stopPropagation();const open=exportMenu.classList.toggle('open');exportToggle.setAttribute('aria-expanded',String(open));});
document.getElementById('exportPng').addEventListener('click',()=>{exportMenu.classList.remove('open');exportToggle.setAttribute('aria-expanded','false');exportPNG();});
document.getElementById('exportSvg').addEventListener('click',()=>{exportMenu.classList.remove('open');exportToggle.setAttribute('aria-expanded','false');exportSVG();});
document.addEventListener('click',e=>{if(!e.target.closest('.export-wrap')){exportMenu.classList.remove('open');exportToggle.setAttribute('aria-expanded','false');}});
document.getElementById('reset').addEventListener('click',()=>{clearConnection(false);closeConnectionBox();document.getElementById('search').value='';document.getElementById('scope').value='narrative';document.getElementById('branch').value='all';document.getElementById('faith').value='all';document.getElementById('focusMode').value='immediate';activeFocusMode='immediate';currentView='family';applyFilters();applyView();closePanel();scheduleUrlSync();});
document.getElementById('language').addEventListener('change',e=>{lang=e.target.value;refreshUI();applyFilters();scheduleUrlSync()});window.addEventListener('resize',()=>{cy.resize();updateSemanticZoom(true)});

// Initial state can be reconstructed from a shared hash URL.
const initialState=stateFromHash();suppressUrlSync=true;lang=initialState.lang;document.getElementById('language').value=lang;
refreshUI();
document.getElementById('scope').value=['all','narrative','historical'].includes(initialState.scope)?initialState.scope:'narrative';
document.getElementById('branch').value=[...document.getElementById('branch').options].some(o=>o.value===initialState.branch)?initialState.branch:'all';
document.getElementById('faith').value=initialState.faith;document.getElementById('focusMode').value=initialState.focus;activeFocusMode=initialState.focus;document.getElementById('search').value=initialState.search;currentView=initialState.view;
applyFilters();applyView();
setTimeout(()=>{
  if(initialState.person&&personById(initialState.person)&&isPersonVisible(initialState.person))focusPerson(initialState.person);else fitReadable();
  if(initialState.connFrom&&initialState.connTo&&personById(initialState.connFrom)&&personById(initialState.connTo))runConnection(initialState.connFrom,initialState.connTo,{fit:true,open:true});
  suppressUrlSync=false;syncUrlState();updateSemanticZoom(true);
},180);
</script>
